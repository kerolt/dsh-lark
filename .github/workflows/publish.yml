name: Publish

# Tag-driven release. Publishing authenticates through npm trusted publishing
# (OIDC): no token is stored anywhere, and the run proves it is this
# repository, this workflow file, and the `npm` environment — the combination
# registered on the package's npm settings page. `access` and `provenance`
# stay in package.json's publishConfig, so a local `npm publish` behaves the
# same.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release for the tag
  id-token: write # trusted publishing attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs an npm CLI that can present the OIDC
      # identity (>= 11.5.1); the one bundled with node 22 predates it.
      - name: Update npm
        run: npm install --global npm@11

      # The identity npm presents is assembled from these, so a publish that
      # fails authentication says here whether the job was handed an OIDC
      # endpoint at all, and which npm is doing the presenting.
      - name: Report the publishing identity
        run: |
          npm --version
          node --version
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC request endpoint: present"
          else
            echo "OIDC request endpoint: MISSING (the job has no id-token permission)"
          fi

      # Installs devDependencies and runs `prepare`, which emits lib/.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # A tag that disagrees with the manifest would publish a version nobody
      # asked for, and npm versions are immutable once taken.
      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match package.json version $manifest" >&2
            exit 1
          fi

      - run: npm publish --loglevel verbose

      # A tag is not a release: the tag drives publishing, and this is what
      # puts the same version on the repository's releases page, with the
      # changelog section it was written for as its body.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
